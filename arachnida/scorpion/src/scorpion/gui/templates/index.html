
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scorpion — Image Metadata</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="min-h-screen bg-slate-950 text-slate-100">
        {% include "components/header.html" %}
        
        <main class="mx-auto max-w-6xl px-6 py-10">
            {% include "components/upload.html" %}
            {% if error %}
                <div class="mt-6 rounded-xl border border-red-900 bg-red-950/40 p-4">
                    <p class="text-sm text-red-300">
                        {{ error }}
                    </p>
                </div>
            {% endif %}

            {% if metadata %}
                <section class="mt-10">
                    <div class="mb-6">
                        <p class="text-xs font-medium uppercase tracking-wider text-slate-500">
                            Metadata
                        </p>

                        <h2 class="mt-1 break-all text-xl font-semibold" >
                            {{ filename }}
                        </h2>
                    </div>

                    {% include "components/file_info.html" %}
                    {% include "components/exif.html" %}
                </section>
            {% endif %}
        </main>

        {% include "components/footer.html" %}
    </body>
</html>
