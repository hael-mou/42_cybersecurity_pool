
<div class="mb-6 overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/70">
    <div class="border-b border-slate-800 bg-slate-900 px-6 py-4" >
        <h3 class="font-medium">
            File information
        </h3>
    </div>

    <div class="divide-y divide-slate-800">
        {% for key, value in metadata.file_info.items() %}
            <div class="grid gap-2 px-6 py-4 sm:grid-cols-[220px_1fr]" >
                <div class="text-sm font-medium text-slate-400" >
                    {{ key }}
                </div>

                <div class="break-all text-sm text-slate-100" >
                    : {{ value }}
                </div>
            </div>
        {% endfor %}
    </div>
</div>
