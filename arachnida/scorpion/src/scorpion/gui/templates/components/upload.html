
<section class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 shadow-xl">
    <div class="mb-6">
        <h2 class="text-lg font-medium">
            Inspect an image
        </h2>

        <p class="mt-1 text-sm text-slate-400">
            Upload an image to inspect its file information
            and EXIF metadata.
        </p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="space-y-5">
        <div>
            <label for="image" class="mb-2 block text-sm font-medium text-slate-300">
                Image
            </label>

            <input
                id="image"
                name="image"
                type="file"
                accept="image/*"
                required
                class="block w-full cursor-pointer rounded-xl
                       border border-slate-700
                       bg-slate-950 text-sm text-slate-400

                       file:mr-4
                       file:border-0
                       file:bg-indigo-600
                       file:px-5
                       file:py-3
                       file:text-sm
                       file:font-medium
                       file:text-white

                       hover:file:bg-indigo-500

                       focus:outline-none
                       focus:ring-2
                       focus:ring-indigo-500"
            >

        </div>

        <button
            type="submit"
            class="rounded-xl bg-indigo-600
                   px-5 py-3 text-sm font-medium
                   text-white transition
                   hover:bg-indigo-500
                   focus:outline-none
                   focus:ring-2 focus:ring-indigo-500"
        >
            Read metadata
        </button>
    </form>
</section>
