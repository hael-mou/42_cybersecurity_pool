[project]
name = "scorpion"
version = "0.1.0"
description = "Scorpion is a tool to view and modify image EXIF metadata"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "hamza el moudden"}]
dependencies = [
    "flask>=3.1.3",
    "humanize>=4.16.0",
    "piexif>=1.1.3",
    "pillow>=12.3.0",
    "rich-argparse>=1.8.0",
    "typing-extensions>=4.16.0",
]

[project.urls]
Homepage = "https://github.com/hael-mou/42_cybersecurity_pool"
Repository = "https://github.com/hael-mou/42_cybersecurity_pool/tree/main/Arachnida/scorpion"

[project.scripts]
scorpion = "scorpion.cli:main"
scorpion-gui = "scorpion.gui:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
