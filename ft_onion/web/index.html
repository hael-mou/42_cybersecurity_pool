<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px 20px;
        }

        .quiz {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        #question {
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .answer {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;

            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;

            text-align: left;
            cursor: pointer;
        }

        .answer:hover {
            background: #f0f0f0;
        }

        .correct {
            background: #d4edda;
            border-color: #28a745;
        }

        .wrong {
            background: #f8d7da;
            border-color: #dc3545;
        }

        #next {
            margin-top: 10px;
            padding: 10px 18px;

            background: #333;
            color: white;

            border: none;
            border-radius: 5px;

            cursor: pointer;
        }

        #next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #result {
            display: none;
        }
    </style>

</head>

<body>
    <div class="quiz">

        <h1>Quiz</h1>

        <div id="question"></div>

        <div id="answers"></div>

        <button id="next" disabled>
            Next
        </button>

        <div id="result"></div>

    </div>


    <script>

        const questions = [
            {
                question: "What does HTML stand for?",

                answers: [
                    "Hyper Text Markup Language",
                    "High Tech Modern Language",
                    "Home Tool Markup Language",
                    "Hyperlink Text Language"
                ],

                correct: 0
            },

            {
                question: "Which language is used to style a web page?",

                answers: [
                    "Python",
                    "CSS",
                    "SQL",
                    "PHP"
                ],

                correct: 1
            },

            {
                question: "Which language is used to make web pages interactive?",

                answers: [
                    "HTML",
                    "CSS",
                    "JavaScript",
                    "SQL"
                ],

                correct: 2
            }
        ];


        let current = 0;
        let score = 0;
        let answered = false;


        const questionElement =
            document.getElementById("question");

        const answersElement =
            document.getElementById("answers");

        const nextButton =
            document.getElementById("next");

        const resultElement =
            document.getElementById("result");


        function showQuestion() {

            answered = false;

            nextButton.disabled = true;

            const question = questions[current];

            questionElement.textContent =
                question.question;

            answersElement.innerHTML = "";


            question.answers.forEach(
                (answer, index) => {

                    const button =
                        document.createElement("button");

                    button.className = "answer";

                    button.textContent = answer;

                    button.onclick = () => {

                        if (answered) {
                            return;
                        }

                        answered = true;

                        const buttons =
                            document.querySelectorAll(".answer");

                        buttons.forEach(
                            button => {
                                button.disabled = true;
                            }
                        );


                        if (index === question.correct) {

                            button.classList.add("correct");

                            score++;

                        } else {

                            button.classList.add("wrong");

                            buttons[
                                question.correct
                            ].classList.add("correct");
                        }


                        nextButton.disabled = false;
                    };


                    answersElement.appendChild(button);
                }
            );
        }


        nextButton.onclick = () => {

            current++;


            if (current < questions.length) {

                showQuestion();

            } else {

                questionElement.style.display = "none";

                answersElement.style.display = "none";

                nextButton.style.display = "none";

                resultElement.style.display = "block";

                resultElement.textContent =
                    `You scored ${score} / ${questions.length}`;
            }
        };


        showQuestion();

    </script>

</body>

</html>
