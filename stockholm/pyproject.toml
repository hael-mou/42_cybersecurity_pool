[project]
name = "stockholm"
version = "0.1.0"
description = "A secure file encryption and decryption tool"
readme = "README.md"
authors = [
    { name = "hamza el moudden", email = "hamzaelmoudden2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "rich-argparse>=1.8.0",
    "typing-extensions>=4.16.0",
    "xattr>=1.3.0",
]

[project.scripts]
stockholm = "stockholm.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
